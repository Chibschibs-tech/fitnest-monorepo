name: Product design evidence
on:
  pull_request:
    paths:
      - 'specs/003-staff-accounts-admin-shell/contracts/**'
      - 'docs/delivery/evidence/foundation-20261031/**'
      - 'packages/core/contracts/B01-I-acceptance-preparation.json'
      - 'tooling/delivery-plan/product-preparation/**'
      - '.github/workflows/product-design-evidence.yml'
permissions:
  contents: read
jobs:
  design-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Staff design reference (not runtime acceptance)
        run: node --test specs/003-staff-accounts-admin-shell/contracts/staff-reference.test.mjs
      - name: Reproduce source inspection (not Docker or CI recognition)
        run: node docs/delivery/evidence/foundation-20261031/verify-source.mjs
